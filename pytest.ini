[pytest]
# Kjør fra repo-roten:  core/venv/bin/pytest
# Testene krever hverken MongoDB, nettverk eller LLM – se tests/conftest.py.
testpaths = tests
addopts = -ra --strict-markers --strict-config
xfail_strict = true
markers =
    kjent_bug: pinner en bekreftet bug i produksjonskoden (xfail, skal ikke «fikses» i testen)
