; PHP-grenser for MIND-ens API-katalog – leses av PHP-FPM per katalog, så
; resten av verten beholder sine standardverdier (2M/8M, som ville avvist et
; hvilket som helst skjermbilde over 2 MB før api/upload.php fikk se det).
;
; upload_max_filesize står bevisst ETT hakk over grensen koden håndhever
; (UPLOAD_MAX_BYTES = 15 MB i lib.php). Da er det MIND som avviser en for
; stor fil, med en forklarende norsk melding og filnavnet – ikke PHP, med et
; nummerert UPLOAD_ERR uten kontekst.
;
; MERK: nginx må slippe kroppen fram i tillegg (client_max_body_size på
; /mind/api/upload.php), ellers stoppes sendingen med 413 før PHP starter.
upload_max_filesize = 16M
post_max_size = 40M
max_file_uploads = 12
